# Tiny Tapeout project information
project:
  title:        "MIDNA-CRYO CSA + StrongARM comparator"
  author:       "nanoeng"
  discord:      ""
  description:  "Charge-sensitive amplifier feeding a StrongARM dynamic latch comparator with on-chip bias generator, sg13g2/cryo-readout derived design, ported to sky130A"
